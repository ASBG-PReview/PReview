
services:
  preview-pr-12:
    build: .
    image: preview-api:local
    ports:
      - "8080:8080"
    environment:
      PR_NUMBER: "12"
      COMMIT_SHA: "a1b2c3d"
      NAMESPACE: "preview-pr-12"

  preview-pr-15:
    image: preview-api:local
    ports:
      - "8081:8080"
    environment:
      PR_NUMBER: "15"
      COMMIT_SHA: "e4f5a6b"
      NAMESPACE: "preview-pr-15"
    depends_on:
      - preview-pr-12
