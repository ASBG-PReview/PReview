# Configure image.repository for ECR before enabling AWS_PREVIEW_ENABLED.
# GHCR packages are private by default: use ECR or configure imagePullSecrets.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: preview
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - pullRequest:
        github:
          owner: ASBG-PReview
          repo: PReview
          labels: [preview-ready]
          # Optional tokenRef for API rate limits; never commit the Secret.
        requeueAfterSeconds: 60
  syncPolicy:
    preserveResourcesOnDeletion: false
  template:
    metadata:
      name: 'preview-pr-{{ .number }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: preview
      source:
        repoURL: https://github.com/ASBG-PReview/PReview.git
        # Only reviewed chart definitions, never a PR-supplied chart.
        targetRevision: main
        path: helm/preview-demo
        helm:
          parameters:
            - name: preview.prNumber
              value: '{{ .number }}'
            # Successful publishing records the tested SHA as a label. A new,
            # failing commit keeps the previous working preview running.
            - name: preview.commitSha
              value: '{{ range .labels }}{{ if hasPrefix "preview-sha-" . }}{{ trimPrefix "preview-sha-" . }}{{ end }}{{ end }}'
            - name: image.repository
              value: ghcr.io/asbg-preview/preview
            - name: image.tag
              value: 'pr-{{ .number }}-{{ range .labels }}{{ if hasPrefix "preview-sha-" . }}{{ trimPrefix "preview-sha-" . }}{{ end }}{{ end }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'preview-pr-{{ .number }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - PruneLast=true
