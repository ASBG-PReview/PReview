# Example values; replace repository, tag, SHA and host in CI.
prNumber: "1"
commitSha: "local"
# Empty uses preview-pr-<prNumber>; must match --namespace.
namespace: ""
namespaceManagement:
  create: false
replicaCount: 1
image:
  repository: "123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/preview-demo"
  tag: "local"
  pullPolicy: IfNotPresent
imagePullSecrets: []
containerPort: 8080
service:
  port: 80
ingress:
  enabled: true
  className: nginx
  host: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""
resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
resourceQuota:
  hard:
    requests.cpu: "1"
    requests.memory: "1Gi"
    limits.cpu: "2"
    limits.memory: "2Gi"
    pods: "4"
    services: "2"
    configmaps: "4"
probes:
  path: /health
  startup:
    periodSeconds: 5
    failureThreshold: 36
  readiness:
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
