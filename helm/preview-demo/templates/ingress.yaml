{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "preview-demo.fullname" . }}
  namespace: {{ include "preview-demo.namespace" . }}
  labels:
    {{- include "preview-demo.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ include "preview-demo.host" . | quote }}
      secretName: {{ required "TLS requires ingress.tls.secretName" .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ include "preview-demo.host" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "preview-demo.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
