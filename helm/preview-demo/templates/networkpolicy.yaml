{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: preview-isolation
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              preview-ingress: "true"
      ports:
        - protocol: TCP
          port: 8000
  # Demo has no outbound dependencies; block cross-preview and metadata access.
  egress: []
{{- end }}
