{{- if ne .Release.Namespace (include "preview-demo.namespace" .) -}}
{{- fail "--namespace must match values.namespace (default preview-pr-<prNumber>)" -}}
{{- end -}}
{{- if .Values.namespaceManagement.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "preview-demo.namespace" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "preview-demo.labels" . | nindent 4 }}
{{- end }}
