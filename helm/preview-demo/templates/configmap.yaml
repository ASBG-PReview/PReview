apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "preview-demo.fullname" . }}
  namespace: {{ include "preview-demo.namespace" . }}
  labels:
    {{- include "preview-demo.labels" . | nindent 4 }}
data:
  PR_NUMBER: {{ .Values.prNumber | quote }}
  COMMIT_SHA: {{ .Values.commitSha | quote }}
  NAMESPACE: {{ include "preview-demo.namespace" . | quote }}
