apiVersion: v1
kind: Service
metadata:
  name: {{ include "preview-demo.fullname" . }}
  namespace: {{ include "preview-demo.namespace" . }}
  labels:
    {{- include "preview-demo.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "preview-demo.selectorLabels" . | nindent 4 }}
