deploymentMode: pr
basePath: ""
main:
  commitSha: ""

replicaCount: 1
rollingUpdate:
  maxSurge: 0
  maxUnavailable: 1

image:
  repository: ghcr.io/asbg-preview/preview
  tag: "0.0.1"
  # 지정하면 tag 대신 digest를 사용합니다.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  path: ""
  pathType: Prefix

preview:
  local: false
  prNumber: ""
  commitSha: ""
