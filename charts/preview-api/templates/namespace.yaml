{{- if .Values.manageNamespace }}
{{- if not (regexMatch "^preview-pr-[1-9][0-9]*$" .Release.Namespace) }}
{{- fail "manageNamespace는 preview-pr-<PR번호> Namespace에서만 사용할 수 있습니다" }}
{{- end }}
{{- if ne .Release.Namespace (printf "preview-pr-%s" (.Values.preview.prNumber | toString)) }}
{{- fail "Namespace와 preview.prNumber가 일치해야 합니다" }}
{{- end }}
{{- if not (regexMatch "^[0-9a-f]{40}$" (.Values.preview.commitSha | toString)) }}
{{- fail "preview.commitSha는 40자리 소문자 16진수여야 합니다" }}
{{- end }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" (.Values.image.digest | default "")) }}
{{- fail "PR Preview에는 검증된 image.digest가 필요합니다" }}
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: preview
{{- end }}
