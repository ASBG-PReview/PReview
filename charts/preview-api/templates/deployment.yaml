{{- $digest := .Values.image.digest | default "" -}}
{{- $tag := .Values.image.tag | default "" -}}
{{- if not (has .Values.deploymentMode (list "pr" "main")) -}}
{{- fail "deploymentMode must be pr or main" -}}
{{- end -}}
{{- $main := eq .Values.deploymentMode "main" -}}
{{- $sha := ternary .Values.main.commitSha .Values.preview.commitSha $main -}}
{{- if or $main (not .Values.preview.local) -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $digest) -}}
{{- fail "main/PR 배포에는 검증된 image.digest가 필요합니다" -}}
{{- end -}}
{{- if and (not $main) (not (regexMatch "^[1-9][0-9]*$" (toString .Values.preview.prNumber))) -}}
{{- fail "preview.prNumber에 양의 정수 PR 번호를 지정해야 합니다" -}}
{{- end -}}
{{- if not (regexMatch "^[0-9a-f]{40}$" (toString $sha)) -}}
{{- fail "해당 모드의 main.commitSha 또는 preview.commitSha에 전체 커밋 SHA를 지정해야 합니다" -}}
{{- end -}}
{{- end -}}
{{- if and $digest (not (regexMatch "^sha256:[0-9a-f]{64}$" $digest)) -}}
{{- fail "image.digest는 sha256: 뒤에 64자리 소문자 16진수여야 합니다" -}}
{{- end -}}
{{- if and (not $digest) (or (not $tag) (eq (lower $tag) "latest")) -}}
{{- fail "image.tag에는 latest가 아닌 버전 또는 커밋 SHA를 지정해야 합니다" -}}
{{- end -}}
{{- $image := printf "%s:%s" (required "image.repository가 필요합니다" .Values.image.repository) $tag -}}
{{- if $digest -}}
{{- $image = printf "%s@%s" .Values.image.repository $digest -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "preview-api.fullname" . }}
  labels:
    {{- include "preview-api.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      {{- toYaml .Values.rollingUpdate | nindent 6 }}
  selector:
    matchLabels:
      {{- include "preview-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "preview-api.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: preview-api
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BASE_PATH
              value: {{ include "preview-api.basePath" . | quote }}
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: {{ include "preview-api.basePath" . | quote }}
            - name: PR_NUMBER
              value: {{ ternary "main" (toString .Values.preview.prNumber) $main | quote }}
            - name: COMMIT_SHA
              value: {{ $sha | quote }}
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          startupProbe:
            httpGet:
              path: {{ printf "%s/health" (include "preview-api.basePath" .) | quote }}
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: {{ printf "%s/health" (include "preview-api.basePath" .) | quote }}
              port: http
          livenessProbe:
            httpGet:
              path: {{ printf "%s/health" (include "preview-api.basePath" .) | quote }}
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
