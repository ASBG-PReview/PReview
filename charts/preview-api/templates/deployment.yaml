{{- $digest := .Values.image.digest | default "" -}}
{{- $tag := .Values.image.tag | default "" -}}
{{- if and $digest (not (regexMatch "^sha256:[0-9a-f]{64}$" $digest)) -}}
{{- fail "image.digest는 sha256: 뒤에 64자리 소문자 16진수여야 합니다" -}}
{{- end -}}
{{- if and (not $digest) (or (not $tag) (eq (lower $tag) "latest")) -}}
{{- fail "image.tag에는 latest가 아닌 버전 또는 커밋 SHA를 지정해야 합니다" -}}
{{- end -}}
{{- $image := printf "%s:%s" (required "image.repository가 필요합니다" .Values.image.repository) $tag -}}
{{- if $digest -}}
{{- $image = printf "%s@%s" .Values.image.repository $digest -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "preview-api.fullname" . }}
  labels:
    {{- include "preview-api.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "preview-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "preview-api.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: preview-api
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PR_NUMBER
              value: {{ .Values.preview.prNumber | quote }}
            - name: COMMIT_SHA
              value: {{ .Values.preview.commitSha | quote }}
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
