{{- $digest := required "image.digest에 검증된 이미지 digest를 지정해야 합니다" .Values.image.digest -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $digest) -}}
{{- fail "image.digest는 sha256: 뒤에 64자리 소문자 16진수여야 합니다" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "preview-api.fullname" . }}
  labels:
    {{- include "preview-api.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "preview-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "preview-api.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: preview-api
          image: {{ printf "%s@%s" .Values.image.repository $digest | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PR_NUMBER
              value: {{ .Values.preview.prNumber | quote }}
            - name: COMMIT_SHA
              value: {{ .Values.preview.commitSha | quote }}
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
