services:
  preview-api:
    build: ./preview-api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PR_NUMBER: "${PR_NUMBER:-local}"
      COMMIT_SHA: "${COMMIT_SHA:-local}"
      NAMESPACE: "${NAMESPACE:-local}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
