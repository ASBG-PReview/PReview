name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Preview publication policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test tests/preview-publish.test.mjs
  docker:
    name: Spring image and registry test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Spring JAR and run JUnit in Docker
        run: docker build -t preview-ci:build ./preview-api
      - name: Verify Spring health and environment identity
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || 'main' }}
          COMMIT_SHA: ${{ github.sha }}
          NAMESPACE: ci-smoke
        run: |
          docker run -d --name preview-smoke --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:18080:8080 -e PR_NUMBER -e COMMIT_SHA -e NAMESPACE preview-ci:build
          base=http://127.0.0.1:18080
          health=$(curl -fsS --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 \
            -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "$base/health")
          test "$health" = 200
          jq -es 'length == 1 and .[0].status == "ok"' "$RUNNER_TEMP/health.json"
          status=$(curl -fsS --max-time 5 -o "$RUNNER_TEMP/env.json" -w '%{http_code}' "$base/environment")
          test "$status" = 200
          jq -es 'length == 1 and (.[0] | .prNumber == env.PR_NUMBER and
            .commitSha == env.COMMIT_SHA and .namespace == env.NAMESPACE)' "$RUNNER_TEMP/env.json"
      - name: Test publication and retry against a local registry
        run: |
          docker save preview-ci:build -o "$RUNNER_TEMP/preview-image.tar"
          docker run -d --name preview-registry -p 127.0.0.1:5000:5000 registry:3
          curl -fsS --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:5000/v2/
          mkdir -p "$HOME/.config/containers"
          printf '[[registry]]\nlocation = "127.0.0.1:5000"\ninsecure = true\n' > "$HOME/.config/containers/registries.conf"
          source_image="docker-archive:$RUNNER_TEMP/preview-image.tar"
          target="127.0.0.1:5000/preview:ci"
          digest=$(bash scripts/publish_preview_image.sh "$source_image" "$target")
          test "$(bash scripts/publish_preview_image.sh "$source_image" "$target")" = "$digest"
          skopeo inspect --raw "docker://$target" > "$RUNNER_TEMP/remote-manifest.json"
          test "$(skopeo manifest-digest "$RUNNER_TEMP/remote-manifest.json")" = "$digest"
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs preview-smoke || true
          docker rm -f preview-smoke preview-registry || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: preview-image
          path: ${{ runner.temp }}/preview-image.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  required:
    name: CI required
    if: always()
    needs: [tests, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
  publish:
    name: Publish main image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: required
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: preview-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-image
          path: ${{ runner.temp }}/preview-artifact
      - name: Publish the tested image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}:sha-$SHA"
          docker load -i "$RUNNER_TEMP/preview-artifact/preview-image.tar"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
          docker tag preview-ci:build "$IMAGE"
          docker push "$IMAGE"
          echo "Published: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Clear registry credentials
        if: always()
        run: docker logout ghcr.io
