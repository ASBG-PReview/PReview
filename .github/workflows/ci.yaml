name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_current_main:
        description: Rebuild, verify and publish the current main after an interrupted release
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  # Titles/body edits and manual checks must not evict required PR checks or a releasing main push.
  group: ci-${{ github.event_name }}-${{ (github.event_name == 'workflow_dispatch' || (github.event.action == 'edited' && !github.event.changes.base)) && format('run-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    if: github.event.action != 'edited' || github.event.changes.base != null
    name: Preview publication policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test tests/*.test.mjs
      - name: Test the local API caller
        run: python3 -m unittest discover -s tools/api-caller -p 'test_*.py'
      - name: Require main for release recovery
        if: github.event_name == 'workflow_dispatch' && inputs.publish_current_main
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Verify PR chart inputs and rendered Pod
        run: bash tests/preview-chart.sh
      - name: Verify main and PR shared ALB configuration
        run: bash tests/main-pr-chart.sh
      - name: Verify ApplicationSet chart resources
        run: bash tests/applicationset-chart.sh
      - name: Verify shared EKS Ingress routes
        run: bash tests/pr-ingress.sh
  docker:
    if: github.event.action != 'edited' || github.event.changes.base != null
    outputs:
      artifact: ${{ steps.archive.outputs.artifact-id }}
    name: Spring image and registry test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the Compose image at the root and the main EKS path
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || 'main' }}
          COMMIT_SHA: ${{ github.sha }}
          NAMESPACE: ci-smoke
        run: |
          expected_version=$(cat preview-api/src/main/version.txt)
          test -n "$expected_version"
          docker compose build
          for prefix in '' '/container-2/main'; do
            BASE_PATH="$prefix" docker compose up --no-build --wait --wait-timeout 100 --detach
            base="http://127.0.0.1:8080$prefix"
            health=$(curl -fsS --max-time 5 -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "$base/health")
            test "$health" = 200
            jq -es 'length == 1 and .[0].status == "ok"' "$RUNNER_TEMP/health.json"
            status=$(curl -fsS --max-time 5 -o "$RUNNER_TEMP/env.json" -w '%{http_code}' "$base/environment")
            test "$status" = 200
            jq -es 'length == 1 and (.[0] | .prNumber == env.PR_NUMBER and
              .commitSha == env.COMMIT_SHA and .namespace == env.NAMESPACE)' "$RUNNER_TEMP/env.json"
            version=$(curl -fsS --max-time 5 -o "$RUNNER_TEMP/version.json" -w '%{http_code}' "$base/version")
            test "$version" = 200
            jq -es --arg expected "$expected_version" \
              'length == 1 and .[0].version == $expected' "$RUNNER_TEMP/version.json"
          done
          container=$(docker compose ps -q preview-api)
          test "$(docker inspect -f '{{.State.Health.Status}}' "$container")" = healthy
          test "$(docker exec "$container" id -u)" -gt 0
          test "$(docker exec "$container" id -g)" -gt 0
          test "$(docker image inspect "$(docker inspect -f '{{.Image}}' "$container")" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          docker tag "$(docker inspect -f '{{.Image}}' "$container")" preview-ci:build
          docker cp "$container:/app/app.jar" "$RUNNER_TEMP/runtime.jar"
      - name: Check the embedded Tomcat security floor in the runtime JAR
        run: |
          jar tf "$RUNNER_TEMP/runtime.jar" > "$RUNNER_TEMP/jar-entries"
          for module in core el websocket; do
            version=$(sed -nE "s|^BOOT-INF/lib/tomcat-embed-${module}-([0-9.]+)\.jar$|\1|p" "$RUNNER_TEMP/jar-entries")
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            dpkg --compare-versions "$version" ge 10.1.61
          done
      - name: Confirm empty, fully skipped, and failing JUnit suites block verification
        run: |
          docker build --target tested -t preview-ci:junit ./preview-api
          docker run --rm -i --network none preview-ci:junit bash -s < tests/preview-junit-gate.sh
      - name: Test publication and retry against a local registry
        run: |
          docker save preview-ci:build -o "$RUNNER_TEMP/preview-image.tar"
          docker run -d --name preview-registry -p 127.0.0.1:5000:5000 registry:3
          curl -fsS --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:5000/v2/
          mkdir -p "$HOME/.config/containers"
          printf '[[registry]]\nlocation = "127.0.0.1:5000"\ninsecure = true\n' > "$HOME/.config/containers/registries.conf"
          # A changed build label guarantees a distinct manifest even on reproducible builders.
          docker build --label test.rebuild=second -t preview-ci:second ./preview-api
          docker save preview-ci:second -o "$RUNNER_TEMP/second.tar"
          bash tests/registry-retry.sh "docker-archive:$RUNNER_TEMP/preview-image.tar" \
            "docker-archive:$RUNNER_TEMP/second.tar" 127.0.0.1:5000/preview:ci
      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose logs preview-api || true
          docker compose down
          docker rm -f preview-registry || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: archive
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish_current_main)
        with:
          name: preview-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-image.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  required:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual CI' || github.event.action == 'edited' && !github.event.changes.base && 'Metadata edit' || 'CI required' }}
    if: always() && (github.event.action != 'edited' || github.event.changes.base != null)
    needs: [tests, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          POLICY_RESULT: ${{ needs.tests.result }}
          IMAGE_RESULT: ${{ needs.docker.result }}
        run: |
          [[ "$POLICY_RESULT" == success && "$IMAGE_RESULT" == success ]]
  publish:
    name: Publish main image
    concurrency:
      group: preview-ghcr-writer
      queue: max
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish_current_main)
    needs: [required, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: preview-publish
    permissions:
      actions: read
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require protected deployment writes before release
        id: writer
        uses: ./.github/actions/deployment-writer
        with:
          approved-rulesets: ${{ vars.PREVIEW_APPROVED_RULESETS }}
          app-id: ${{ vars.PREVIEW_WRITER_APP_ID }}
          private-key: ${{ secrets.PREVIEW_WRITER_PRIVATE_KEY }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ needs.docker.outputs.artifact || '0' }}
          path: ${{ runner.temp }}/preview-artifact
      - name: Prepare the tested image
        id: prepare
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          directory="$RUNNER_TEMP/main-canonical"
          archive="docker-archive:$RUNNER_TEMP/preview-artifact/preview-image.tar"
          digest=$(bash scripts/publish_preview_image.sh prepare "$archive" "$directory")
          IMAGE_DIGEST="$digest" node scripts/promote-main.mjs intent > "$RUNNER_TEMP/main-image-intent.json"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Authorize this tested main image before any package write
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/main-image-intent.json
      - name: Publish or recover the authorized main digest
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CANDIDATE: ${{ steps.prepare.outputs.digest }}
        run: |
          test "$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$SHA"
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/main-registry-auth.json"
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$REGISTRY_AUTH_FILE" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          image="ghcr.io/${REPOSITORY,,}:sha-$SHA"
          digest=$(bash scripts/publish_preview_image.sh publish-main "$RUNNER_TEMP/main-canonical" "$image" "$CANDIDATE")
          skopeo inspect --config "docker://${image%:*}@$digest" |
            jq -es 'length == 1 and (.[0] | .os == "linux" and .architecture == "amd64")'
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf 'Verified main image `%s@%s`\n' "${image%:*}" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Promote the verified main image
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_STATE_TOKEN: ${{ steps.writer.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: node scripts/promote-main.mjs
