name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Preview publication policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test tests/preview-publish.test.mjs tests/local-previews.test.mjs
      - name: Verify PR chart inputs and rendered Pod
        run: bash tests/preview-chart.sh
  docker:
    name: Spring image and registry test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and wait for the Spring service using Compose
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || 'main' }}
          COMMIT_SHA: ${{ github.sha }}
          NAMESPACE: ci-smoke
        run: |
          docker compose up --build --wait --wait-timeout 100 --detach
          base=http://127.0.0.1:8080
          health=$(curl -fsS --max-time 5 -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "$base/health")
          test "$health" = 200
          jq -es 'length == 1 and .[0].status == "ok"' "$RUNNER_TEMP/health.json"
          status=$(curl -fsS --max-time 5 -o "$RUNNER_TEMP/env.json" -w '%{http_code}' "$base/environment")
          test "$status" = 200
          jq -es 'length == 1 and (.[0] | .prNumber == env.PR_NUMBER and
            .commitSha == env.COMMIT_SHA and .namespace == env.NAMESPACE)' "$RUNNER_TEMP/env.json"
          expected_version=$(cat preview-api/src/main/version.txt)
          test -n "$expected_version"
          curl -fsS --max-time 5 -o "$RUNNER_TEMP/version.json" "$base/version"
          jq -es --arg expected "$expected_version" \
            'length == 1 and .[0].version == $expected' "$RUNNER_TEMP/version.json"
          container=$(docker compose ps -q preview-api)
          test "$(docker inspect -f '{{.State.Health.Status}}' "$container")" = healthy
          test "$(docker exec "$container" id -u)" -gt 0
          test "$(docker exec "$container" id -g)" -gt 0
          docker tag "$(docker inspect -f '{{.Image}}' "$container")" preview-ci:build
          docker cp "$container:/app/app.jar" "$RUNNER_TEMP/runtime.jar"
      - name: Check the embedded Tomcat security floor in the runtime JAR
        run: |
          jar tf "$RUNNER_TEMP/runtime.jar" > "$RUNNER_TEMP/jar-entries"
          for module in core el websocket; do
            version=$(sed -nE "s|^BOOT-INF/lib/tomcat-embed-${module}-([0-9.]+)\.jar$|\1|p" "$RUNNER_TEMP/jar-entries")
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            dpkg --compare-versions "$version" ge 10.1.61
          done
      - name: Confirm empty, fully skipped, and failing JUnit suites block verification
        run: |
          docker build --target tested -t preview-ci:junit ./preview-api
          docker run --rm -i --network none preview-ci:junit bash -s < tests/preview-junit-gate.sh
      - name: Test publication and retry against a local registry
        run: |
          docker save preview-ci:build -o "$RUNNER_TEMP/preview-image.tar"
          docker run -d --name preview-registry -p 127.0.0.1:5000:5000 registry:3
          curl -fsS --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:5000/v2/
          mkdir -p "$HOME/.config/containers"
          printf '[[registry]]\nlocation = "127.0.0.1:5000"\ninsecure = true\n' > "$HOME/.config/containers/registries.conf"
          # A changed build label guarantees a distinct manifest even on reproducible builders.
          docker build --label test.rebuild=second -t preview-ci:second ./preview-api
          docker save preview-ci:second -o "$RUNNER_TEMP/second.tar"
          bash tests/registry-retry.sh "docker-archive:$RUNNER_TEMP/preview-image.tar" \
            "docker-archive:$RUNNER_TEMP/second.tar" 127.0.0.1:5000/preview:ci
      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose logs preview-api || true
          docker compose down
          docker rm -f preview-registry || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: preview-image
          path: ${{ runner.temp }}/preview-image.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  required:
    name: CI required
    if: always()
    needs: [tests, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
  publish:
    name: Publish main image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: required
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: preview-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-image
          path: ${{ runner.temp }}/preview-artifact
      - name: Publish the tested image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}:sha-$SHA"
          docker load -i "$RUNNER_TEMP/preview-artifact/preview-image.tar"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
          docker tag preview-ci:build "$IMAGE"
          docker push "$IMAGE"
          echo "Published: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Clear registry credentials
        if: always()
        run: docker logout ghcr.io
