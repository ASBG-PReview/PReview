name: Reconcile verified preview state
on:
  workflow_run:
    workflows: [Publish verified PR preview, PR 상태 변경 알림]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      cleanup_pr:
        description: '종료된 PR 번호. 비워 두면 대기 중인 정리 요청을 처리합니다.'
        type: string
        required: false
      dry_run:
        description: 'Git과 레지스트리에 쓰지 않고 정리 계획만 조회'
        type: boolean
        default: true
permissions: {}
concurrency:
  group: preview-state-reconciliation
  queue: max
jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: 정리 계획 조회
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.cleanup_pr }}
        run: |
          set -euo pipefail
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/plan-auth.json"
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          node scripts/reconcile-preview-state.mjs "$REPOSITORY" --list-cleanup > "$RUNNER_TEMP/tickets.json"
          cat "$RUNNER_TEMP/tickets.json"
          if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then exit 2; fi
          jq -r --arg pr "$PR_NUMBER" '.[] | select($pr == "" or (.prNumber|tostring) == $pr) | .prNumber' "$RUNNER_TEMP/tickets.json" > "$RUNNER_TEMP/eligible.txt"
          mapfile -t numbers < "$RUNNER_TEMP/eligible.txt"
          if (( ${#numbers[@]} == 0 )); then echo "현재 보존 기간을 지난 정리 요청이 없습니다."; fi
          if (( ${#numbers[@]} )); then
            printf '%s' "$GH_TOKEN" | skopeo login --authfile "$REGISTRY_AUTH_FILE" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
            for n in "${numbers[@]}"; do node scripts/cleanup-preview-images.mjs "$REPOSITORY" "$n"; done
          fi
  reconcile:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name != 'workflow_dispatch' || !inputs.dry_run) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.id == github.event.repository.id &&
        ((github.event.workflow_run.path == '.github/workflows/pr-publish.yml' &&
          github.event.workflow_run.event == 'workflow_run' &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch) ||
         (github.event.workflow_run.path == '.github/workflows/pr-lifecycle.yml' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.display_title == 'PR 상태 변경'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: preview-publish
    permissions:
      contents: read
      actions: read
      attestations: read
      packages: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - id: writer
        uses: ./.github/actions/deployment-writer
        with:
          approved-rulesets: ${{ vars.PREVIEW_APPROVED_RULESETS }}
          app-id: ${{ vars.PREVIEW_WRITER_APP_ID }}
          private-key: ${{ secrets.PREVIEW_WRITER_PRIVATE_KEY }}
      - name: 검증된 PR 배포 상태 조정
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_STATE_TOKEN: ${{ steps.writer.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PREVIEW_MAX_SLOTS: ${{ vars.PREVIEW_MAX_SLOTS }}
          PREVIEW_CHART_REVISIONS: ${{ vars.PREVIEW_CHART_REVISIONS }}
          CLOSED_PR: ${{ github.event_name == 'workflow_dispatch' && inputs.cleanup_pr || '' }}
        run: |
          set -euo pipefail
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/state-auth.json"
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          if ! printf '%s' "$GH_TOKEN" | skopeo login --authfile "$REGISTRY_AUTH_FILE" --username "$GITHUB_ACTOR" --password-stdin ghcr.io; then
            echo "::warning::이미지 검증을 보류하고 Git 종료 처리를 계속합니다."
            export PREVIEW_REGISTRY_UNAVAILABLE=1
          fi
          args=("$REPOSITORY")
          if [[ -n "$CLOSED_PR" ]]; then args+=(--closed-pr "$CLOSED_PR"); fi
          node scripts/reconcile-preview-state.mjs "${args[@]}"
  cleanup:
    needs: reconcile
    if: >-
      !cancelled() && needs.reconcile.result != 'skipped' &&
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: preview-publish
    concurrency:
      group: preview-ghcr-writer
      queue: max
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: 보존 기간이 지난 정리 요청 확인
        id: tickets
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PR: ${{ inputs.cleanup_pr }}
        run: |
          set -euo pipefail
          node scripts/reconcile-preview-state.mjs "$GITHUB_REPOSITORY" --list-cleanup > "$RUNNER_TEMP/tickets.json"
          jq -r --arg pr "$REQUESTED_PR" '.[] | select($pr == "" or (.prNumber|tostring) == $pr) | [.prNumber, .ticketSha] | @tsv' "$RUNNER_TEMP/tickets.json" > "$RUNNER_TEMP/tickets.tsv"
          if [[ -s "$RUNNER_TEMP/tickets.tsv" ]]; then echo 'pending=true' >> "$GITHUB_OUTPUT"; fi
      - id: writer
        if: steps.tickets.outputs.pending == 'true'
        uses: ./.github/actions/deployment-writer
        with:
          approved-rulesets: ${{ vars.PREVIEW_APPROVED_RULESETS }}
          app-id: ${{ vars.PREVIEW_WRITER_APP_ID }}
          private-key: ${{ secrets.PREVIEW_WRITER_PRIVATE_KEY }}
      - name: 전용 이미지 회수
        if: steps.tickets.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/cleanup-auth.json"
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          : > "$RUNNER_TEMP/completed.tsv"
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$REGISTRY_AUTH_FILE" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          failed=0
          while IFS=$'\t' read -r pr ticket; do
            if PREVIEW_CLEANUP_TICKET="$ticket" node scripts/cleanup-preview-images.mjs "$GITHUB_REPOSITORY" "$pr" --apply; then
              printf '%s\t%s\n' "$pr" "$ticket" >> "$RUNNER_TEMP/completed.tsv"
            else
              result=$?
              if [[ "$result" != 75 ]]; then failed=1; fi
            fi
          done < "$RUNNER_TEMP/tickets.tsv"
          exit "$failed"
      - name: 회수가 끝난 종료 요청 기록
        if: ${{ !cancelled() && steps.writer.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_STATE_TOKEN: ${{ steps.writer.outputs.token }}
        run: |
          set -euo pipefail
          if [[ ! -s "$RUNNER_TEMP/completed.tsv" ]]; then exit 0; fi
          failed=0
          while IFS=$'\t' read -r pr ticket; do
            node scripts/reconcile-preview-state.mjs "$GITHUB_REPOSITORY" --ack-cleanup "$pr" "$ticket" || failed=1
          done < "$RUNNER_TEMP/completed.tsv"
          exit "$failed"
