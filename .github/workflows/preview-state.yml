name: Reconcile verified preview state
on:
  workflow_run:
    workflows: [Publish verified PR preview]
    types: [completed]
  pull_request_target:
    types: [closed, reopened, synchronize, labeled, unlabeled]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: preview-state-reconciliation
  queue: max
jobs:
  reconcile:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: write
      packages: read
      pull-requests: read
      statuses: read
    steps:
      # Never check out PR-controlled code in this privileged workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Authenticate to GHCR and reconcile current PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          authfile="$RUNNER_TEMP/preview-state-registry-auth.json"
          trap 'rm -f "$authfile"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$authfile" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          export REGISTRY_AUTH_FILE="$authfile"
          node scripts/reconcile-preview-state.mjs "$REPOSITORY"
