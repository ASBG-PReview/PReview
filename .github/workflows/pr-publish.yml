name: Publish verified PR preview
on:
  workflow_run:
    workflows: [Build PR preview image]
    types: [completed]
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.path == '.github/workflows/pr-build.yml' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      digest: ${{ steps.prepare.outputs.digest }}
      image: ${{ steps.gate.outputs.image }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # workflow_run uses the default branch
          persist-credentials: false
      - name: Match the build to a live PR and trusted build definition
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/preview-publish.mjs check
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.gate.outputs.eligible == 'true'
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: preview-image-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/preview-artifact
      - name: Verify image metadata and prepare the registry manifest
        if: steps.gate.outputs.eligible == 'true'
        id: prepare
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          source_image="docker-archive:$RUNNER_TEMP/preview-artifact/preview-image.tar"
          skopeo inspect --config "$source_image" | jq -e \
            '.config.Labels["org.opencontainers.image.revision"] == env.EXPECTED_SHA and
             .config.Labels["org.opencontainers.image.source"] == (env.GITHUB_SERVER_URL + "/" + env.GITHUB_REPOSITORY)'
          digest=$(bash scripts/publish_preview_image.sh prepare "$source_image" "$RUNNER_TEMP/preview-canonical")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        if: steps.gate.outputs.eligible == 'true'
        with:
          name: preview-canonical-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-canonical/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  authorize:
    needs: prepare
    if: needs.prepare.outputs.digest != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind the verified candidate to this PR before any registry write
        env:
          PREVIEW_DIGEST: ${{ needs.prepare.outputs.digest }}
        run: node scripts/preview-publish.mjs intent
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/preview-intent.json
  publish:
    needs: [prepare, authorize]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: preview-publish-${{ github.event.workflow_run.pull_requests[0].number }}-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: read
      attestations: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # The REST run ID also selects artifacts from a successful prepare on an earlier attempt.
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ needs.prepare.outputs.artifact || '0' }}
          path: ${{ runner.temp }}/preview-canonical
      - name: Publish or recover the previously authorized image
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          CANDIDATE_DIGEST: ${{ needs.prepare.outputs.digest }}
        run: |
          eligible=$(node scripts/preview-publish.mjs current)
          if [[ "$eligible" != true ]]; then exit 0; fi
          authfile="$RUNNER_TEMP/preview-ghcr-auth.json"
          trap 'rm -f "$authfile"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$authfile" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          digest=$(REGISTRY_AUTH_FILE="$authfile" bash scripts/publish_preview_image.sh publish \
            "$RUNNER_TEMP/preview-canonical" "$IMAGE" "$CANDIDATE_DIGEST")
          printf 'Verified `%s` · `%s`\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
  label:
    needs: publish
    if: needs.publish.outputs.digest != ''
    concurrency:
      group: preview-label-${{ github.event.workflow_run.pull_requests[0].number }}
      # A slow publication for an older head must not evict the newest waiting job.
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind the PR head and verified digest to this publisher attempt
        env:
          PREVIEW_DIGEST: ${{ needs.publish.outputs.digest }}
        run: node scripts/preview-publish.mjs receipt
      - name: Sign the publication receipt with this workflow's GitHub identity
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/preview-publication.json
      - name: Record the verified digest on this commit and label its PR
        env:
          PREVIEW_DIGEST: ${{ needs.publish.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/preview-publish.mjs label
