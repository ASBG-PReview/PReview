name: Publish preview
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: preview-publish
    permissions:
      actions: read
      contents: read
      packages: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run uses the default-branch workflow and trusted scripts.
          ref: main
          persist-credentials: false
      - name: Verify source run and current PR
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { selectPreview } = require('./scripts/preview.cjs');
            const run = context.payload.workflow_run;
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({ ...context.repo, username: run.actor.login });
            if (!['admin', 'maintain', 'write'].includes(permission.permission)) {
              core.notice('Preview publishing is restricted to repository collaborators.'); return;
            }
            // Resolve authoritative PRs from GitHub; never trust artifact metadata.
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, { ...context.repo, commit_sha: run.head_sha });
            const pr = selectPreview(run, prs, `${context.repo.owner}/${context.repo.repo}`);
            if (!pr) { core.notice('No current, same-repository PR for this successful run.'); return; }
            core.setOutput('pr', pr.number);
            core.setOutput('sha', run.head_sha);
            core.setOutput('image', `ghcr.io/${context.repo.owner}/${context.repo.repo}`.toLowerCase());
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.source.outputs.pr != ''
        with:
          name: preview-image
          path: ${{ runner.temp }}/preview-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Push tested image to GHCR
        if: steps.source.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.actor }}
          IMAGE: ${{ steps.source.outputs.image }}
          PR: ${{ steps.source.outputs.pr }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          # Loading an image does not run it. Never run PR code in this job.
          docker load -i "$RUNNER_TEMP/preview-artifact/preview-image.tar"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
          docker tag preview-ci:build "$IMAGE:pr-$PR-$SHA"
          docker push "$IMAGE:pr-$PR-$SHA"
          echo "Published: $IMAGE:pr-$PR-$SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: AWS OIDC credentials
        if: steps.source.outputs.pr != '' && vars.AWS_PREVIEW_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Push to ECR
        if: steps.source.outputs.pr != '' && vars.AWS_PREVIEW_ENABLED == 'true'
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          PR: ${{ steps.source.outputs.pr }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          test -n "$ECR_REPOSITORY"
          REGISTRY="${ECR_REPOSITORY%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          docker tag preview-ci:build "$ECR_REPOSITORY:pr-$PR-$SHA"
          docker push "$ECR_REPOSITORY:pr-$PR-$SHA"
      - name: Mark published revision
        if: steps.source.outputs.pr != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR: ${{ steps.source.outputs.pr }}
          SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            const { publishedLabels } = require('./scripts/preview.cjs');
            const number = Number(process.env.PR), sha = process.env.SHA;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            if (pr.state !== 'open' || pr.head.sha !== sha || pr.draft) {
              core.notice('PR changed or closed during publishing; not updating preview.'); return;
            }
            await github.rest.issues.setLabels({ ...context.repo, issue_number: number, labels: publishedLabels(pr.labels, sha) });
            await core.summary.addHeading(`PR #${number}: image ready`).addRaw(`Published SHA: ${sha}. Kubernetes deployment is managed separately by Argo CD.`).write();
      - name: Clear registry credentials
        if: always()
        run: |
          docker logout ghcr.io || true
          rm -f "$HOME/.docker/config.json"
