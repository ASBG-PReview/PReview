name: Deployment branch writer
description: Check deployment branch protections and mint a repository-scoped Git writer token
inputs:
  approved-rulesets:
    description: Administrator-verified deployment ruleset revisions
    required: true
  app-id:
    description: Deployment writer GitHub App ID
    required: true
  private-key:
    description: Deployment writer private key from the main-only environment
    required: true
outputs:
  token:
    description: Installation token for deployment Git writes
    value: ${{ steps.writer.outputs.token }}
runs:
  using: composite
  steps:
    - name: Require the default branch and deployment branch protections
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        PREVIEW_APPROVED_RULESETS: ${{ inputs.approved-rulesets }}
        WRITER_APP_ID: ${{ inputs.app-id }}
      run: |
        set -euo pipefail
        test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
        node scripts/deployment-rules.mjs check "$GITHUB_REPOSITORY" "$WRITER_APP_ID"
    - id: writer
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: write
