name: 작업
description: 구현하거나 검증할 작업
title: "[Task] "
body:
  - type: textarea
    id: objective
    attributes:
      label: 목표
      description: 구현할 동작과 범위
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 실행해서 확인할 수 있는 조건
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 검증 증거
      description: PR, Actions 실행, 테스트 결과 링크
